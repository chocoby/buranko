name: Build and upload release (macos)

on:
  push:
    tags:
      - 'v*'

env:
  APP_NAME: buranko

jobs:
  build:
    strategy:
      matrix:
        include:
          - target: aarch64-apple-darwin
            arch: arm64
          - target: x86_64-apple-darwin
            arch: x64
    runs-on: macos-15
    env:
      ARCHIVE_NAME: buranko_macos-${{ matrix.arch }}.tar.gz

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Install Rust
        uses: jdx/mise-action@v5.2.9

      - name: Build application
        run: |
          rustup target add ${{ matrix.target }}
          cargo build --locked --release --target ${{ matrix.target }}
          tar -czf "$ARCHIVE_NAME" -C target/${{ matrix.target }}/release "$APP_NAME"

      - name: Upload release asset
        uses: svenstaro/upload-release-action@2.11.5
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: ${{ env.ARCHIVE_NAME }}
          asset_name: ${{ env.ARCHIVE_NAME }}
          tag: ${{ github.ref }}
          overwrite: true
