name: Build and upload release (linux)

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build
        required: true
        type: string
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  APP_NAME: buranko
  ARCHIVE_NAME: buranko_linux-x64.tar.gz

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || github.ref }}

      - name: Build application
        run: |
          docker run --rm -t -v "$HOME/.cargo/registry/:/root/.cargo/registry" -v "$(pwd)":/volume clux/muslrust:1.100.0-stable cargo build --locked --release

      - name: Create archive
        run: |
          tar -czf "$ARCHIVE_NAME" -C target/x86_64-unknown-linux-musl/release "$APP_NAME"

      - name: Upload release asset
        uses: svenstaro/upload-release-action@2.11.5
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: ${{ env.ARCHIVE_NAME }}
          asset_name: ${{ env.ARCHIVE_NAME }}
          tag: ${{ inputs.tag || github.ref }}
          overwrite: true

